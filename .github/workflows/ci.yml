name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: all tests (unit, layout and lock, review re-derivation)
        run: python -m unittest discover -s tests -v
      - name: level 1 learn tests
        run: python -m unittest tests.test_learn_data_parallel -v
      - name: level 1 learn run
        run: python level-1-learn/run_learn.py
      - name: level 2 build tests
        run: python -m unittest tests.test_build_sharding -v
      - name: level 2 build run
        run: python level-2-build/run_build.py
      - name: level 3 deep prep tests
        run: python -m unittest tests.test_deep_prep_cpu -v
      - name: level 3 deep prep run
        run: python level-3-deep/run_deep_prep.py
      - name: level 3 deep analysis tests and re-score from committed evidence
        working-directory: level-3-deep/cluster
        run: |
          python -m unittest test_analysis -v
          python analysis.py check ../runs/main.jsonl
      - name: results regenerate unchanged from the code
        run: git diff --exit-code -- 'level-*/results*.json'
